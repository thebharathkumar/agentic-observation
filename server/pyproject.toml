[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trace-replay"
version = "0.1.0"
description = "Local-first scrub-through trace replay server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.9.0",
  "trace-replay-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[project.scripts]
trace-replay = "trace_replay_server.cli:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
